# UNVERIFIED: Docker Desktop was not running in the build environment. See README "Docker".
services:
  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    environment:
      SENTRIX_DEMO_PASSWORD: ${SENTRIX_DEMO_PASSWORD:-sentrix-demo}
      SENTRIX_CORS_ORIGINS: http://localhost:8080
    volumes: [ "sentrix-data:/app/data" ]
    ports: [ "8000:8000" ]
  frontend:
    build: { context: ., dockerfile: frontend/Dockerfile }
    depends_on: [ backend ]
    ports: [ "8080:8080" ]
volumes:
  sentrix-data: {}
